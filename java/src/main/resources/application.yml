# 日志配置
server:
  port: 0

logging:
  level:
    com.jdyx: debug
    com.kevin: debug
    org.springframework: error
    com.bba.mapper: debug
  # config: classpath:logback-plus.xml

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      p6spy: false
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: pg_zh
      # 严格模式 匹配不到数据源则报错
      strict: true
      public-key: MF0wDQYJKoZIhvcNAQEBBQADTAAwSQJCAJDA0FvNL1Z/dy+DmJUYR63fL3RDFLtK2p3QaV6oGxd1tkK/zZnJHzHDe5iApXzF61gnfe3hqG85nbz1l4Plj+5DAgMBAAE=
      datasource:
        # PG-公共数据源
        pg_zh:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://10.128.21.134:5432/cas25_test_qa?currentSchema=zh&useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
          username: cas25_qa
          password: cas25_qa
        # PG-计量平台数据源 (Updated to match Python test env: 10.128.21.148:5431)
        pg_measure_platform:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://10.128.21.134:5432/cas25_test_qa?currentSchema=measure_platform&useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
          username: cas25_qa
          password: cas25_qa

      hikari:
        # 最大连接池数量
        maxPoolSize: 30
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 60000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 60000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，30分钟
        maxLifetime: 180000
        # 连接测试query（配置检测连接是否有效）
        connectionTestQuery: SELECT 1
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring:
  redis:
    # 地址
    host: 10.128.21.135
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码(如没有密码请注释掉)
    password: QAZxsw123
    # 连接超时时间
    timeout: 1000s
    # 是否开启ssl
    ssl: false

redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 16
  # Netty线程池数量
  nettyThreads: 32
  # 单节点配置
  singleServerConfig:
    # 客户端名称
    clientName: ${project-info.name}
    # 最小空闲连接数
    connectionMinimumIdleSize: 32
    # 连接池大小
    connectionPoolSize: 64
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 60000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50
